name: NexaAI CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Lint, Test & Evaluation Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations (SQLite test db)
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        run: |
          pytest -c backend/pytest.ini backend/tests -v

      - name: Run 50-Prompt Quality & Safety Evaluation Benchmark
        run: |
          python backend/eval/evaluator.py baseline

  frontend-tests:
    name: Frontend Tests & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm test -- --run

      - name: Run TypeScript typecheck & production build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: nexa-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: nexa-frontend:ci-test
